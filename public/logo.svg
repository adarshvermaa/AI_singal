<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160" fill="none">
  <defs>
    <linearGradient id="logoWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>
    <linearGradient id="logoSilver" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94A3B8" />
      <stop offset="50%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
  </defs>

  <!-- Left Icon Mark (120x120 within 160 height) -->
  <g transform="translate(16, 20) scale(0.234375)">
    <!-- Background rounded square -->
    <rect width="512" height="512" rx="120" fill="#0F172A" />
    <rect width="506" height="506" x="3" y="3" rx="117" stroke="#334155" stroke-width="3" fill="none" opacity="0.6" />

    <!-- The ALPHX Glyph -->
    <path d="M128 396 L256 124 L384 396 L324 396 L256 248 L188 396 Z" fill="url(#logoWhite)" />
    <path d="M142 164 L370 384 L336 414 L114 198 Z" fill="url(#logoSilver)" />
    <polygon points="256,220 286,260 256,300 226,260" fill="#0F172A" />
    <polygon points="256,236 272,260 256,284 240,260" fill="url(#logoWhite)" />
  </g>

  <!-- Typography: ALPHX -->
  <text x="160" y="86" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="56" letter-spacing="4" fill="#FFFFFF">ALPHX</text>

  <!-- Badge Pill -->
  <rect x="410" y="48" width="68" height="24" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1" />
  <text x="444" y="64" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="11" letter-spacing="1.5" fill="#F8FAFC" text-anchor="middle">PRO</text>

  <!-- Subtitle: QUANTITATIVE AI TERMINAL -->
  <text x="162" y="116" font-family="'JetBrains Mono', 'Courier New', monospace" font-weight="600" font-size="14" letter-spacing="3" fill="#94A3B8">AI QUANTITATIVE TERMINAL</text>
</svg>
